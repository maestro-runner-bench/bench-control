name: Collect bench results

# Reads the e2e jobs of the bench forks (maestro-runner) and of upstream
# (Maestro / agent-device) and appends them to results/jobs.jsonl, then
# rewrites results/SUMMARY.md (see scripts/collect.py).

on:
  schedule:
    - cron: '30 23 * * *' # daily, 23:30 UTC
  workflow_dispatch:
    inputs:
      runs_per_source:
        description: Newest runs with e2e jobs to read per source
        default: '30'

permissions:
  contents: write

concurrency:
  group: bench-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Collect
        env:
          GH_TOKEN: ${{ secrets.BENCH_TOKEN }}
          RUNS_PER_SOURCE: ${{ inputs.runs_per_source || '30' }}
        run: python3 scripts/collect.py
      - name: Commit the results
        run: |
          git config user.name "maestro-runner-bench"
          git config user.email "bench@devicelab.dev"
          git add results
          if git diff --cached --quiet; then
            echo "No new results"
            exit 0
          fi
          git commit -q -m "results: $(date -u +%Y-%m-%d)"
          git push
