name: Sync and run benches

# Rebases each bench fork's maestro-runner branch onto the latest upstream
# code and starts its test workflows (see repos.json and
# scripts/sync-and-run.sh).

on:
  # Five 4.5-hour cycles a day (UTC; repos.json slotsUTC): React Native at
  # +0:00 (its builds take all 5 macOS runners for ~2h), then Expo, React
  # Navigation and enriched-html at +2:00, pager-view at +2:30.
  schedule:
    - cron: '0 0 * * *' # 00:00
    - cron: '0 2 * * *' # 02:00
    - cron: '30 2 * * *' # 02:30
    - cron: '30 4 * * *' # 04:30
    - cron: '30 6 * * *' # 06:30
    - cron: '0 7 * * *' # 07:00
    - cron: '0 9 * * *' # 09:00
    - cron: '0 11 * * *' # 11:00
    - cron: '30 11 * * *' # 11:30
    - cron: '30 13 * * *' # 13:30
    - cron: '30 15 * * *' # 15:30
    - cron: '0 16 * * *' # 16:00
    - cron: '0 18 * * *' # 18:00
    - cron: '0 20 * * *' # 20:00
    - cron: '30 20 * * *' # 20:30
  workflow_dispatch:
    inputs:
      only:
        description: One repo from repos.json (empty = all)
        default: ''
      dry_run:
        description: Rebase only; do not push or start anything
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: bench-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Check the token
        env:
          GH_TOKEN: ${{ secrets.BENCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the BENCH_TOKEN secret: a fine-grained token for the maestro-runner-bench org with Contents, Workflows and Actions read/write."
            exit 1
          fi
      - name: Sync and run
        env:
          GH_TOKEN: ${{ secrets.BENCH_TOKEN }}
          ONLY: ${{ inputs.only }}
          SCHEDULED_HOUR: ${{ github.event_name == 'schedule' && github.event.schedule || '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: ./scripts/sync-and-run.sh
