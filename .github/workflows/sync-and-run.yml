name: Sync and run benches

# Rebases each bench fork's maestro-runner branch onto the latest upstream
# code and starts its test workflows (see repos.json and
# scripts/sync-and-run.sh).

on:
  # Five 4.5-hour cycles a day (UTC; repos.json slotsUTC): React Native at
  # +0:00 (all 5 macOS runners for ~2.5h), then Expo, React Navigation and
  # enriched-html at +2:00, pager-view at +2:30. GitHub starts scheduled runs
  # hours late, so a tick every 15 minutes starts whatever is due once its
  # macOS runners are free (scripts/plan.py).
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      only:
        description: One repo from repos.json (empty = all)
        default: ''
      dry_run:
        description: Rebase only; do not push or start anything
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: bench-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Check the token
        env:
          GH_TOKEN: ${{ secrets.BENCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the BENCH_TOKEN secret: a fine-grained token for the maestro-runner-bench org with Contents, Workflows and Actions read/write."
            exit 1
          fi
      - name: Sync and run
        env:
          GH_TOKEN: ${{ secrets.BENCH_TOKEN }}
          ONLY: ${{ inputs.only }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: ./scripts/sync-and-run.sh
